{% load reviews/reviews.html %}

{%block title%}
    <title>Your Review</title>
{% endblock %}
{% block content %}

    <form>
        {% csrf_token %}
        {% for field in form %}
        <div class="form-control {% if field.errors %} errors {% endif %}">
            {{ field.label_tag }}
            {{ field }}
            {{ field.errors }}
        </div>
        {% endfor %}
        
        <button type="submit">Send</button>
    <form/>
{% endblock %}
