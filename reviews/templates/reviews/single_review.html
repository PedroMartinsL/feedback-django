{%extends "reviews/base.html"%} {% block title %}Review Details{% endblock %} {%
block content %}
<p><strong>User Name:</strong> {{ review.user_name }}</p>
<p><strong>Rating:</strong> {{ review.rating }}</p>
<p><strong>Text:</strong> {{ review.review_text}}</p>
{% if is_favorite%}
    <p>This is my favorite!</p>
{% else %}
    <form method="POST" action="/reviews/favorite">
    {% csrf_token %}
    <input type="hidden" name="review_id" value="{{ review.id }}" />
    <button>Favorite</button>
    </form>
{% endif %} 
{% endblock %}
